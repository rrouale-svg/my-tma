<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicken Road</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Сюда нужно вставить прямую ссылку на картинку из игры для фона */
            background: url('https://raw.githubusercontent.com/rrouale-svg/my-tma/refs/heads/main/ewrwr.jfif') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .btn {
            background-color: #FFC107; /* Желтый цвет кнопки */
            color: #000;
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }
        /* Легкая анимация кнопки для повышения кликабельности */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <!-- Сюда вставляете вашу партнерскую ссылку -->
    <a href="https://lbspin777.xyz/85wdUd" class="btn">Перейти</a>
</body>
</html>
